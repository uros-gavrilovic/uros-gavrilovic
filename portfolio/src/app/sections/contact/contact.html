<section id="contact" class="contact" aria-labelledby="contact-title">
	<app-waves-background />

	<div class="container contact__inner reveal">
		<p class="eyebrow">04 · Contact</p>
		<h2 id="contact-title" class="contact__title">Let’s connect.</h2>
		<p class="contact__text">
			I’m most active on LinkedIn, so that’s the quickest way to reach me, but email works just as
			well.
		</p>

		<div class="contact__actions">
			<a class="btn btn-light" [href]="profile.linkedin" target="_blank" rel="noopener noreferrer">
				<app-icon name="linkedin" />
				Connect on LinkedIn
			</a>
			<a class="btn btn-outline-light" [href]="mailto">
				<app-icon name="mail" />
				{{ profile.email }}
			</a>
		</div>
	</div>

	<ul class="container contact__posts" aria-label="Recent LinkedIn posts">
		@for (post of linkedinPosts; track post) {
			<li class="reveal"><app-linkedin-post [urn]="post" /></li>
		}
	</ul>
</section>
