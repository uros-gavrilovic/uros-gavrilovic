<div class="viewport">
	<ul #track class="track" tabindex="0" [attr.aria-label]="label()" (scroll)="onScroll()">
		@for (image of images(); track $index) {
			<li class="slide">
				<img [src]="image.src" [alt]="image.alt" loading="lazy" decoding="async" />
			</li>
		}
	</ul>

	@if (images().length > 1) {
		<button
			type="button"
			class="arrow arrow--prev"
			aria-label="Previous image"
			[attr.aria-disabled]="index() === 0 || null"
			(click)="show(index() - 1)"
		>
			<app-icon name="chevron-left" />
		</button>
		<button
			type="button"
			class="arrow arrow--next"
			aria-label="Next image"
			[attr.aria-disabled]="index() === images().length - 1 || null"
			(click)="show(index() + 1)"
		>
			<app-icon name="chevron-right" />
		</button>
	}
</div>

@if (images().length > 1) {
	<div class="dots">
		@for (image of images(); track $index; let i = $index) {
			<button
				type="button"
				class="dot"
				[attr.aria-label]="'Show images ' + (i + 1)"
				[attr.aria-current]="i === index() || null"
				(click)="show(i)"
			></button>
		}
	</div>
}
