name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_HREF: /

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: portfolio/.nvmrc
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - run: npm ci

      - run: npx ng build --configuration production --base-href "$BASE_HREF"

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so deep links reach the Angular router.
      - run: cp dist/portfolio/browser/index.html dist/portfolio/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: portfolio/dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
